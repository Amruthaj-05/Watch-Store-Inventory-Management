{% extends "base.html" %}
{% block content %}
<h2>Customers</h2>

<!-- Add Customer Form -->
<form method="POST">
    <input type="text" name="name" placeholder="Customer Name" required>
    <input type="text" name="phone" placeholder="Phone Number" required>
    <input type="email" name="email" placeholder="Email">
    <button type="submit">Add Customer</button>
</form>

<!-- Customer List -->
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Action</th>
    </tr>
    {% for customer in customers %}
    <tr>
        <td>{{ customer[0] }}</td>
        <td>{{ customer[1] }}</td>
        <td>{{ customer[2] }}</td>
        <td>{{ customer[3] }}</td>
        <td><a href="/customers/edit/{{ customer[0] }}">Edit</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
