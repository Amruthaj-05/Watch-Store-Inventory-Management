{% extends "base.html" %}
{% block content %}
<div style="max-width:400px; margin:50px auto; padding:20px; border:1px solid #ddd; border-radius:8px; background:#f9f9f9;">
    <body class="login">
        <h2 style="text-align:center;">Login</h2>
        <form method="POST" action="/login">
            <label>Username:</label><br>
            <input type="text" name="username" required style="width:100%; padding:8px; margin-bottom:10px;"><br>

            <label>Password:</label><br>
            <input type="password" name="password" required style="width:100%; padding:8px; margin-bottom:15px;"><br>

            <button type="submit" style="width:100%; padding:10px; background:#2c3e50; color:white; border:none; border-radius:5px;">
                Login
            </button>
        </form>
    </body>
</div>
{% endblock %}
