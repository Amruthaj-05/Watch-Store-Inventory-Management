{% extends "base.html" %}
{% block content %}
<h2>Edit Inventory</h2>

<form method="POST">
    Name: <input type="text" name="name" value="{{ item[1] }}" required><br>
    Price: <input type="number" step="0.01" name="price" value="{{ item[2] }}" required><br>
    Quantity: <input type="number" name="quantity" value="{{ item[3] }}" required><br>
    <input type="submit" value="Update">
</form>
{% endblock %}
