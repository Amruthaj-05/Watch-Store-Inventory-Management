<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Watch Store</title>
    <style>
        body { font-family: Arial, sans-serif;
             margin: 0; 
             padding: 0;
             }
        body.index,body.login{
             background-image: url('static/watch_background.jpg');
             background-repeat: no-repeat;
            background-size: cover;  
            background-position: center center; 

        }
        header { background-color: #2c3e50; color: white; padding: 20px 20px; text-align: center;font-size: 20px;}
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        nav a.active { color: #f1c40f; text-decoration: underline; }
        nav a:hover { text-decoration: underline; }
        .container { padding: 20px;}
        table { border-collapse: collapse; width: 100%; margin-top: 20px;}
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 10px; text-align: left; }
        th { background-color: #f2f2f2;}
        button { padding: 5px 10px; margin-top: 10px; }
        input, select { padding: 5px; margin: 5px 0; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
            <a href="/customers" class="{% if active_page == 'customers' %}active{% endif %}">Customers</a>
            <a href="/sales" class="{% if active_page == 'sales' %}active{% endif %}">Sales</a>
            <a href="/inventory" class="{% if active_page == 'inventory' %}active{% endif %}">Inventory</a>
            <a href="/report" class="{% if active_page == 'report' %}active{% endif %}">Sales Report</a>
            {% if session.get('user') %}
                <a href="/logout">Logout </a>
            {% else %}
                <a href="/login" class="{% if active_page == 'login' %}active{% endif %}">Login</a>
            {% endif %}

        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
